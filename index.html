<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>PELO Data Collection | Quantum Ledger</title>

    <!-- Inline favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>">

    <!-- FONTS & ICONS -->
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- FIREBASE SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #00B4D8; --primary-dark: #0096C7; --secondary: #00F5D4; --quantum: #8A2BE2;
            --success: #00FF88; --danger: #EF476F; --gold: #FFD700; --warning: #FFD166;
            --dark-bg: #05080F; --dark-card: #0A0F1A;
            --glass-border: rgba(0, 180, 216, 0.15);
            --text-primary: #E8EDF5; --text-secondary: #8A99B0; --text-muted: #4A5A6A;
            --font-exo: 'Exo 2', sans-serif; --font-mono: 'Space Mono', monospace;
            --pelo-green: #1B4D3D; --pelo-gold: #C8A450; --pelo-gold-glow: rgba(200, 164, 80, 0.15);
        }
        body { font-family: var(--font-exo); background: var(--dark-bg); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; padding: 16px; }
        .container { max-width: 800px; margin: 0 auto; padding: 16px; position: relative; z-index: 1; }
        
        /* GLASSMORPHISM */
        .glass-card { 
            background: rgba(15, 25, 45, 0.35); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid var(--glass-border); 
            border-radius: 20px; 
            padding: 28px; 
            margin-bottom: 20px; 
            transition: all 0.3s ease; 
        }
        .glass-card:hover { border-color: var(--pelo-gold); box-shadow: 0 0 30px rgba(200, 164, 80, 0.08); }
        
        /* HEADER */
        .header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 16px 20px; 
            background: rgba(15, 25, 45, 0.35); 
            backdrop-filter: blur(20px); 
            border: 1px solid var(--glass-border); 
            border-radius: 20px; 
            margin-bottom: 20px; 
            flex-wrap: wrap; 
            gap: 12px; 
        }
        .header-logo { height: 48px; width: auto; filter: drop-shadow(0 0 20px var(--pelo-gold-glow)); }
        .header-text h1 { font-size: 1.1rem; font-weight: 800; background: linear-gradient(135deg, var(--pelo-gold), var(--pelo-green)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .header-text p { font-size: 0.5rem; color: var(--text-secondary); letter-spacing: 2px; font-family: var(--font-mono); }
        
        /* HANDSHAKE BADGE & RETRY */
        .handshake-container { display: flex; align-items: center; gap: 8px; }
        .handshake-badge { 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 0.6rem; 
            font-family: var(--font-mono); 
            border: 1px solid var(--gold); 
            color: var(--gold); 
            background: rgba(255, 215, 0, 0.08); 
            transition: all 0.3s; 
        }
        .handshake-badge.connected { border-color: var(--success); color: var(--success); background: rgba(0, 255, 136, 0.08); }
        .handshake-badge.unreachable { border-color: var(--danger); color: var(--danger); background: rgba(239, 71, 111, 0.08); }
        .btn-retry { 
            background: transparent; 
            border: 1px solid var(--glass-border); 
            border-radius: 20px; 
            padding: 4px 12px; 
            color: var(--text-secondary); 
            cursor: pointer; 
            font-size: 0.55rem; 
            transition: all 0.2s;
        }
        .btn-retry:hover { border-color: var(--pelo-gold); color: var(--pelo-gold); }

        /* FORM ELEMENTS */
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; font-family: var(--font-mono); }
        input, select, textarea { 
            width: 100%; 
            padding: 12px 16px; 
            background: rgba(5, 8, 15, 0.6); 
            border: 1px solid var(--glass-border); 
            border-radius: 12px; 
            color: var(--text-primary); 
            font-family: var(--font-exo); 
            font-size: 0.85rem; 
            transition: all 0.3s; 
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 12px rgba(0, 180, 216, 0.2); }
        
        /* BUTTONS */
        .btn-primary { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, var(--pelo-green), var(--pelo-gold)); 
            border: none; 
            border-radius: 60px; 
            color: white; 
            font-weight: 700; 
            cursor: pointer; 
            font-family: var(--font-exo); 
            font-size: 0.9rem; 
            transition: transform 0.2s ease; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            margin-top: 10px; 
        }
        .btn-primary:hover { transform: scale(1.01); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* TOAST */
        .toast { 
            position: fixed; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(10, 18, 35, 0.95); 
            backdrop-filter: blur(20px); 
            border: 1px solid var(--glass-border); 
            border-radius: 16px; 
            padding: 14px 28px; 
            color: var(--text-primary); 
            z-index: 9999; 
            font-size: 0.8rem; 
            max-width: 90%; 
            text-align: center; 
            animation: toastIn 0.3s ease; 
        }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        
        /* FOOTER */
        .footer { text-align: center; padding: 20px; font-size: 0.55rem; color: var(--text-secondary); font-family: var(--font-mono); margin-top: 20px; border-top: 1px solid var(--glass-border); }
        .nav-links { display: flex; justify-content: center; gap: 16px; margin-bottom: 12px; }
        .nav-links a { color: var(--primary); text-decoration: none; font-size: 0.65rem; transition: color 0.2s; }
        .nav-links a:hover { color: var(--secondary); }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <header class="header">
            <img src="https://raw.githubusercontent.com/mindtechindustriesai-alt/my-images/main/pelo_community_final_image-removebg-preview.png" alt="PELO Recovery" class="header-logo" onerror="this.style.display='none'" />
            <div class="header-text">
                <h1>PELO Data Collection</h1>
                <p>Secure Quantum Ledger Gateway</p>
            </div>
            <!-- STATUS BADGE & RETRY -->
            <div class="handshake-container">
                <span id="handshakeBadge" class="handshake-badge"><i class="fas fa-satellite-dish"></i> Handshake: Checking...</span>
                <button onclick="checkHandshake()" class="btn-retry"><i class="fas fa-sync-alt"></i> Retry</button>
            </div>
        </header>

        <!-- NAVIGATION LINKS -->
        <div class="nav-links">
            <a href="dashboard.html"><i class="fas fa-chart-line"></i> View Dashboard</a>
            <a href="verify.html"><i class="fas fa-shield-alt"></i> Verify Certificate</a>
        </div>

        <!-- FORM CARD -->
        <div class="glass-card">
            <form id="dataCollectionForm">
                <div class="form-group">
                    <label for="ownerName">Collector / Entity Name</label>
                    <input type="text" id="ownerName" required placeholder="Enter full name or entity..." />
                </div>
                <div class="form-group">
                    <label for="area">Operating Area / Region</label>
                    <input type="text" id="area" required placeholder="e.g., Gauteng Central" />
                </div>
                <div class="form-group">
                    <label for="oilVolume">Oil Volume Collected (Liters)</label>
                    <input type="number" id="oilVolume" min="1" required placeholder="e.g., 250" />
                </div>
                <div class="form-group">
                    <label for="contactPerson">Contact Person / Email</label>
                    <input type="text" id="contactPerson" required placeholder="email@example.com or phone..." />
                </div>
                <div class="form-group">
                    <label for="notes">Additional Notes / Remarks</label>
                    <textarea id="notes" rows="3" placeholder="Optional collection details..."></textarea>
                </div>
                <button type="submit" id="submitBtn" class="btn-primary">
                    <i class="fas fa-paper-plane"></i> Submit Entry & Issue Certificate
                </button>
            </form>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <p>© 2026 PELO Recovery · Powered by MindTech Industries</p>
            <p style="margin-top: 4px;">⚛️ Canonical Anchor: CHSH S=2.76 (IBM Kingston) · On-Demand: S=2.02 (IBM Fez)</p>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        // FIREBASE CONFIGURATION
        var firebaseConfig = {
            apiKey: "AIzaSyD5OB59lG6bAsmQ7A97zXP_MfQ5AM3BYaw",
            authDomain: "mindflow-ai-education.firebaseapp.com",
            projectId: "mindflow-ai-education",
            storageBucket: "mindflow-ai-education.firebasestorage.app",
            messagingSenderId: "157615197603",
            appId: "1:157615197603:web:540d67781fc55d04c11e16"
        };

        firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();

        const BACKEND_URL = 'https://pelo-complete-bm8s.onrender.com';
        const handshakeBadge = document.getElementById('handshakeBadge');
        const form = document.getElementById('dataCollectionForm');
        const submitBtn = document.getElementById('submitBtn');

        // 1. Check Handshake on Page Load (15s timeout for Render cold start)
        async function checkHandshake() {
            handshakeBadge.className = 'handshake-badge';
            handshakeBadge.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Handshake: Checking...';
            
            try {
                const response = await fetch(`${BACKEND_URL}/health`, {
                    method: 'GET',
                    signal: AbortSignal.timeout(15000) // Increased to 15s
                });
                if (response.ok) {
                    handshakeBadge.className = 'handshake-badge connected';
                    handshakeBadge.innerHTML = '<i class="fas fa-check-circle"></i> Handshake: CONNECTED';
                } else {
                    throw new Error('Backend returned ' + response.status);
                }
            } catch (err) {
                console.error('Handshake error:', err);
                handshakeBadge.className = 'handshake-badge unreachable';
                handshakeBadge.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Handshake: UNREACHABLE';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkHandshake();
            // Ensure auth state
            auth.signInAnonymously().catch(err => console.warn('Anonymous auth warning:', err));
        });

        // 2 & 3. Handle Form Submission, Backend Call, and Firestore Storage
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const ownerName = document.getElementById('ownerName').value.trim();
            const area = document.getElementById('area').value.trim();
            const oilVolume = parseFloat(document.getElementById('oilVolume').value) || 0;
            const contactPerson = document.getElementById('contactPerson').value.trim();
            const notes = document.getElementById('notes').value.trim();
            const timestamp = new Date().toISOString();

            if (!ownerName || !area || oilVolume <= 0) {
                showToast('❌ Please fill in all required fields correctly.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing & Issuing Certificate...';

            try {
                // Step 1: Call Backend API to issue certificate
                const payload = {
                    entry_id: 'PELO-' + Date.now(),
                    owner_name: ownerName,
                    area: area,
                    oil_volume: oilVolume,
                    contact_person: contactPerson,
                    notes: notes,
                    timestamp: timestamp
                };

                const apiResponse = await fetch(`${BACKEND_URL}/api/v1/issue/certificate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!apiResponse.ok) {
                    const errData = await apiResponse.json().catch(() => ({}));
                    throw new Error(errData.detail || 'Backend certificate issuance failed');
                }

                const result = await apiResponse.json();
                const certificateHash = result.certificate_hash;
                const signature = result.signature;

                if (!certificateHash) {
                    throw new Error('No certificate hash returned from backend.');
                }

                // Step 2: Store Entry in Firestore with certificate_hash
                const entryData = {
                    ownerName: ownerName,
                    area: area,
                    oilVolume: oilVolume,
                    contactPerson: contactPerson,
                    notes: notes,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    auditStatus: 'verified',
                    certificate_hash: certificateHash,
                    signature: signature || ''
                };

                await db.collection('entries').add(entryData);

                showToast('✅ Entry submitted & Certificate Hash stored successfully!', 'success');
                form.reset();

            } catch (error) {
                console.error('Submission error:', error);
                showToast('❌ Error: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Entry & Issue Certificate';
            }
        });

        function showToast(msg, type) {
            var existing = document.querySelector('.toast');
            if (existing) existing.remove();
            var div = document.createElement('div');
            div.className = 'toast';
            if (type === 'error') div.style.borderColor = 'var(--danger)';
            if (type === 'success') div.style.borderColor = 'var(--success)';
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(function() { if (div.parentNode) div.remove(); }, 4000);
        }
    </script>
</body>
</html>
